services:
  mlflow-db:
    image: postgres:15
    container_name: mlflow-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER_MLFLOW}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_MLFLOW}
      POSTGRES_DB: ${POSTGRES_DB_MLFLOW}
    ports:
      - "127.0.0.1:${POSTGRES_PORT_MLFLOW}:5432"
    volumes:
      - ${MLFLOW_DB_DATA}:/var/lib/postgresql/data
  app-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    ports:
      - "127.0.0.1:${APP_DB_PORT}:5432"
    volumes:
      - ${APP_DB_DATA}:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: mlflow_minio
    restart: always
    command: server /data --address ":9000" --console-address ":9023"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_CONSOLE_PORT: ${MINIO_CONSOLE_PORT}
    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9023"
    volumes:
      - ${MINIO_DATA}:/data

  mlflow:
    build: .
    container_name: mlflow_server
    restart: always
    depends_on:
      - mlflow-db
      - minio
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER_MLFLOW}:${POSTGRES_PASSWORD_MLFLOW}@mlflow-db:5432/${POSTGRES_DB_MLFLOW}
      ARTIFACT_ROOT: s3://${MINIO_BUCKET}/
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1 # MinIO требует указания региона, даже если он не используется
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_PORT: ${MLFLOW_PORT}
    ports:
      - "127.0.0.1:${MLFLOW_PORT}:5000"

  model-server:
    build:
      context: .
      dockerfile: Dockerfile.model
    restart: always
    profiles: ["legacy"]
    depends_on:
      - mlflow
      - app-db
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MODEL_ALIAS: Production
      MODEL_ROLE: production
      MODEL_SERVER_POLL_SECONDS: 120
      MODEL_NAME: ${MODEL_NAME:-"my_model"}
    ports:
      - "127.0.0.1:${MODEL_SERVER_PORT:-8003}:8000"

  prometheus:
    image: prom/prometheus:v2.53.2
    restart: always
    user: "0"
    network_mode: "host"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=:${PROMETHEUS_PORT}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    restart: always
    network_mode: "host"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command: --config.file=/etc/blackbox_exporter/config.yml


  loki:
    image: grafana/loki:3.0.0
    restart: always
    command: -config.file=/etc/loki/config.yml -validation.allow-structured-metadata=false
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/config.yml:ro
      - mlops_loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"

  promtail:
    image: grafana/promtail:3.0.0
    restart: always
    command: -config.file=/etc/promtail/config.yml -log.level=warn
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./monitoring/promtail/positions:/positions
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    ports:
      - "127.0.0.1:${PROMTAIL_PORT:-9080}:9080"

  grafana:
    image: grafana/grafana:11.4.0
    restart: always
    network_mode: "host"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT}
      GF_LOG_LEVEL: warn
      GF_SERVER_ROUTER_LOGGING: "false"
      GF_PLUGINS_DISABLE_PLUGINS: xychart
      PROMETHEUS_PORT: ${PROMETHEUS_PORT}
      LOKI_PORT: ${LOKI_PORT}
      APP_DB_PORT: ${APP_DB_PORT}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - mlops_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards-min:/etc/grafana/dashboards-min
    depends_on:
      - prometheus

  mlflow-autoserve:
    build:
      context: .
      dockerfile: Dockerfile.model
    image: mlops-mlflow-autoserve
    restart: always
    depends_on:
      - mlflow
      - minio
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_SERVE_ALIASES: ${MLFLOW_SERVE_ALIASES:-Production,Test}
      MLFLOW_SERVE_PORT: 5000
      MLFLOW_SERVE_IMAGE: mlops-mlflow
      MLFLOW_SERVE_NETWORK: mlops_default
      MLFLOW_SERVE_POLL_SECONDS: ${MLFLOW_SERVE_POLL_SECONDS:-30}
      PYTHONPATH: /app/src
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: python -m app.mlflow_autoserve

volumes:
  mlops_app_db_data:
  mlops_mlflow_db_data:
  mlops_minio_data:
  mlops_grafana_data:
  mlops_loki_data:
