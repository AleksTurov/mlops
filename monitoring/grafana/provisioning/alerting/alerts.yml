apiVersion: 1

groups:
  - orgId: 1
    name: MLOps Alerts
    folder: MLOps
    interval: 1m
    rules:
      - uid: service-down
        title: Service Down (HTTP)
        condition: C
        for: 1m
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: probe_success == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  reducer:
                    type: last
                  operator:
                    type: and
        noDataState: Alerting
        execErrState: Alerting

      - uid: model-5xx-rate
        title: Served Model Endpoint Down
        condition: C
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(probe_success{instance=~".*mlflow-serve-.*"} == 0)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  reducer:
                    type: last
                  operator:
                    type: and
        noDataState: OK
        execErrState: Alerting

      - uid: model-p95-latency
        title: Served Model Probe Latency > 500ms
        condition: C
        for: 5m
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: max(probe_duration_seconds{instance=~".*mlflow-serve-.*"})
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
                  reducer:
                    type: last
                  operator:
                    type: and
        noDataState: OK
        execErrState: Alerting
