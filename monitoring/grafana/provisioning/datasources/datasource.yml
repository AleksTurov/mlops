apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://127.0.0.1:${PROMETHEUS_PORT}
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://127.0.0.1:${LOKI_PORT}

  - name: Postgres
    type: postgres
    uid: app-postgres
    access: proxy
    url: 127.0.0.1:${APP_DB_PORT}
    database: ${APP_DB_NAME}
    user: ${APP_DB_USER}
    secureJsonData:
      password: ${APP_DB_PASSWORD}
    jsonData:
      sslmode: disable
