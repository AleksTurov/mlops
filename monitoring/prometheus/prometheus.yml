global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "mlflow-serve"
    metrics_path: /metrics
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_mlflow_serve]
        regex: true
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: __MLFLOW_SERVE_NETWORK__
        action: keep
      - source_labels: [__meta_docker_network_ip]
        regex: .+
        action: keep
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_mlflow_port]
        separator: ':'
        regex: (.+):(.+)
        target_label: __address__
        replacement: $1:$2
      - source_labels: [__meta_docker_container_label_mlflow_model]
        target_label: model
      - source_labels: [__meta_docker_container_label_mlflow_alias]
        target_label: alias


  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://mlflow:5000/health]
        labels:
          service: mlflow
      - targets: [http://airflow-webserver:8080/health]
        labels:
          service: airflow
      - targets: [http://minio:9000/minio/health/live]
        labels:
          service: minio
      - targets: [http://prometheus:9090/-/healthy]
        labels:
          service: prometheus
      - targets: [http://loki:3100/ready]
        labels:
          service: loki
      - targets: [http://grafana:3000/api/health]
        labels:
          service: grafana
      - targets: [http://mlflow-autoserve:5010/health]
        labels:
          service: autoserve
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "blackbox-mlflow-serve"
    metrics_path: /probe
    params:
      module: [http_2xx]
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_mlflow_serve]
        regex: true
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: __MLFLOW_SERVE_NETWORK__
        action: keep
      - source_labels: [__meta_docker_network_ip]
        regex: .+
        action: keep
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_mlflow_port]
        separator: ':'
        regex: (.+):(.+)
        target_label: __param_target
        replacement: http://$1:$2/ping
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__meta_docker_container_label_mlflow_model]
        target_label: model
      - source_labels: [__meta_docker_container_label_mlflow_alias]
        target_label: alias
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "blackbox-tcp"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [mlflow-db:5432]
        labels:
          service: mlflow-db
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
