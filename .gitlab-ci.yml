stages:
  - build
  - deploy
variables:
  COMPOSE_FILE_DEV: "docker-compose.yml"
  COMPOSE_PROJECT_NAME_DEV: "mlops"
  DOCKER_COMPOSE_TIMEOUT: "600"
  GIT_CLEAN_FLAGS: "-ffdx -e monitoring/promtail/positions/ -e monitoring/promtail/positions/positions.yaml"
build_dev:
  stage: build
  tags:
    - dev
    - data_science
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - docker-compose.yml
        - Dockerfile
        - src/**/*
        - monitoring/**/*
        - .gitlab-ci.yml
        - requirements.txt
  script:
    - set -euxo pipefail
    - set -a
    - source /data/aturov/vault/scripts/export-env.sh kv/data/dev/mlops
    - source /data/aturov/vault/scripts/export-env.sh kv/data/dev/grafana
    - source /data/aturov/vault/scripts/export-env.sh kv/data/dev/minio
    - source /data/aturov/vault/scripts/export-env.sh kv/data/dev/mlflow
    - source /data/aturov/vault/scripts/export-env.sh kv/data/dev/airflow
    - set +a
    - DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker compose -p "$COMPOSE_PROJECT_NAME_DEV" -f "$COMPOSE_FILE_DEV" build --pull
  timeout: 1h
  retry: 1
deploy_dev:
  stage: deploy
  tags:
    - dev
    - data_science
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - docker-compose.yml
        - Dockerfile
        - src/**/*
        - monitoring/**/*
        - .gitlab-ci.yml
        - requirements.txt
  script:
    - set -euxo pipefail
    - set -a
    - source /data/aturov/vault/scripts/export-env.sh kv/data/dev/mlops
    - source /data/aturov/vault/scripts/export-env.sh kv/data/dev/grafana
    - source /data/aturov/vault/scripts/export-env.sh kv/data/dev/minio
    - source /data/aturov/vault/scripts/export-env.sh kv/data/dev/mlflow
    - source /data/aturov/vault/scripts/export-env.sh kv/data/dev/airflow
    - set +a
    - docker compose -p "$COMPOSE_PROJECT_NAME_DEV" -f "$COMPOSE_FILE_DEV" down --remove-orphans || true
    - docker compose -p "$COMPOSE_PROJECT_NAME_DEV" -f "$COMPOSE_FILE_DEV" up -d --remove-orphans
    - docker compose -p "$COMPOSE_PROJECT_NAME_DEV" -f "$COMPOSE_FILE_DEV" ps
  timeout: 30m
  retry: 1
